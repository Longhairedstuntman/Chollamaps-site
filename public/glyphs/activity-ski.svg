<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.450 0.950 23.55 19.4" width="23.55" height="19.4" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Backcountry skier skinning uphill, moving right. 24-unit grid, black template. -->
  <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
    <!-- torso, leaning into the climb -->
    <path d="M12.6 5.4 L10.3 11.3" stroke-width="2.3"/>
    <!-- front leg: hip → knee → boot -->
    <path d="M10.3 11.3 L13.5 13.6 L14.7 17" stroke-width="2"/>
    <!-- back leg -->
    <path d="M10.3 11.3 L8.5 14.5 L8.2 17.4" stroke-width="2"/>
    <!-- front arm, pole planted ahead -->
    <path d="M12.2 6.8 L15.4 9" stroke-width="1.7"/>
    <path d="M16.1 6.4 L17.7 18.2" stroke-width="1.1"/>
    <!-- back arm, pole trailing -->
    <path d="M12 7 L8.6 8.6" stroke-width="1.7"/>
    <path d="M8.9 6.9 L5.3 18.8" stroke-width="1.1"/>
    <!-- skis: back ski lower, front ski ahead with the tip rising -->
    <path d="M1.2 19.6 L15.6 18.1" stroke-width="1.5"/>
    <path d="M7.6 18.7 L21 17.1 Q23.2 16.8 23.3 15" stroke-width="1.5"/>
  </g>
  <g fill="#000">
    <!-- head -->
    <circle cx="13.3" cy="2.6" r="1.65"/>
    <!-- pack, sitting off the back of the torso -->
    <path d="M9 5.9 Q10.4 5 11.4 5.6 L10.7 9.9 Q9.3 10.6 8.1 9.7 Z"/>
  </g>
</svg>
