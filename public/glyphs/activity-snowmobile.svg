<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.300 3.200 22.7 16.2" width="22.7" height="16.2" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Mountain snowmobile, side view, facing right. 24-unit grid, black template. -->
  <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
    <!-- windshield rising off the hood -->
    <path d="M15.2 8.6 L17.4 4" stroke-width="1.6"/>
    <!-- handlebar -->
    <path d="M17 5.3 L13.6 6.4" stroke-width="1.4"/>
    <!-- front ski with rising tip -->
    <path d="M14.4 18.6 L21.6 18.6 Q23.6 18.6 23.5 16.4" stroke-width="1.6"/>
    <!-- ski strut -->
    <path d="M18.8 13.4 L18.8 18" stroke-width="1.6"/>
  </g>
  <g fill="#000">
    <!-- seat hump at the back, tunnel, hood sloping to the nose -->
    <path d="M2.2 13.4 L2.6 9.6 Q3.4 7.4 5.6 7.3 L8.2 7.3 Q9.2 8.9 10.4 9 L15 9 Q18.6 9.2 21.6 11.4 L22.4 13.4 Z"/>
    <!-- track: belt with the inside cut out (evenodd), so it masks correctly on the web -->
    <path fill-rule="evenodd" d="M4.2 13.2 L13.2 13.2 A2.9 2.9 0 0 1 13.2 19 L4.2 19 A2.9 2.9 0 0 1 4.2 13.2 Z M4.6 14.9 L12.8 14.9 A1.2 1.2 0 0 1 12.8 17.3 L4.6 17.3 A1.2 1.2 0 0 1 4.6 14.9 Z"/>
    <!-- bogie wheels inside the track -->
    <circle cx="5.3" cy="16.1" r="0.75"/>
    <circle cx="8.7" cy="16.1" r="0.75"/>
    <circle cx="12.1" cy="16.1" r="0.75"/>
  </g>
</svg>
